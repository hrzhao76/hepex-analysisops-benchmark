version: 2
task_id: t001_zpeak_fit
required_outputs:
- name: fit_summary
  canonical_filename: fit_summary.json
  type: json
- name: interpretation
  canonical_filename: interpretation.md
  type: markdown
- name: submission_trace
  canonical_filename: submission_trace.json
  type: json
schemas:
  fit_summary.json:
    required_fields:
    - task_id
    - status
    - fit_result
    - fit_method
    field_types:
      task_id: string
      status: string
      fit_result: object
      fit_method: object
    nested_required_fields:
      fit_result:
        required_fields:
        - mu
        - sigma
        - gof
      fit_method:
        required_fields:
        - model
        - fit_range
        - binned_or_unbinned
        - optimizer
        - initial_params
        - uncertainties_method
      fit_result.gof:
        required_fields:
        - p_value
        - chi2_ndof
  interpretation.md:
    constraints:
      non_empty: true
      min_characters: 20
  submission_trace.json:
    required_fields:
    - task_id
    - status
    - workflow_stages
    - output_files_generated
    field_types:
      task_id: string
      status: string
      workflow_stages: array_object
      output_files_generated: array_string
    nested_required_fields:
      workflow_stages:
        required_fields:
        - stage_id
        - order_index
        - status
