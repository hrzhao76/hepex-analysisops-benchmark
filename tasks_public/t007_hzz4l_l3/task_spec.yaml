      role: data
      dids: ["data"]
    - name: 'Background $Z,t\bar{t},t\bar{t}+V,VVV$'
      role: background
      dids: [410470, 410155, 410218, 410219, 412043, 364243, 364242, 364246, 364248, 700320, 700321, 700322, 700323, 700324, 700325]
      color: "#6b59d3"
    - name: 'Background $ZZ^{*}$'
      role: background
      dids: [700600]
      color: "#ff0000"
    - name: 'Signal ($m_H$ = 125 GeV)'
      role: signal
      dids: [345060, 346228, 346310, 346311, 346312, 346340, 346341, 346342]
      color: "#00cdff"
constraints:
  response_format: submission_bundle_v1
  allow_purple_network: false
