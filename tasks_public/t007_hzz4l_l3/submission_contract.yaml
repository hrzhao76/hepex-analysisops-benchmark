version: 1
level: l3
required_outputs:
- name: four_lepton_mass_spectrum
  canonical_filename: four_lepton_mass_spectrum.json
  type: json
  machine_readable: true
- name: four_lepton_excess_summary
  canonical_filename: four_lepton_excess_summary.json
  type: json
  machine_readable: true
- name: interpretation
  canonical_filename: interpretation.md
  type: markdown
  machine_readable: false
- name: submission_trace
  canonical_filename: submission_trace.json
  type: json
  machine_readable: true
optional_outputs:
- name: four_lepton_mass_spectrum_plot
  canonical_filename: four_lepton_mass_spectrum_plot.image_ref
  type: image_ref
  machine_readable: false
schemas:
  four_lepton_mass_spectrum.json:
    required_fields:
    - observable
    - bin_edges
    - data_counts
    - total_background_counts
    - total_background_uncertainty
    - signal_counts
    field_types:
      observable: string
      bin_edges: array_float
      data_counts: array_number
      total_background_counts: array_number
      total_background_uncertainty: array_number
      signal_counts: array_number
    constraints:
      array_alignment:
      - fields:
        - bin_edges
        - data_counts
        relation: edges_equals_counts_plus_one
      - fields:
        - data_counts
        - total_background_counts
        relation: same_length
      - fields:
        - data_counts
        - total_background_uncertainty
        relation: same_length
      - fields:
        - data_counts
        - signal_counts
        relation: same_length
  four_lepton_excess_summary.json:
    required_fields:
    - method_type
    - signal_region
    - window_observed_yield
    - window_background_yield
    - window_signal_yield
    - window_numerator_yield
    - significance_proxy
    - significance_formula
    field_types:
      method_type: string
      signal_region: array_float_len_2
      window_observed_yield: float
      window_background_yield: float
      window_signal_yield: float
      window_numerator_yield: float
      significance_proxy: float
      significance_formula: string
  interpretation.md:
    required_sections: []
    constraints:
      non_empty: true
      min_characters: 80
  four_lepton_mass_spectrum_plot.image_ref:
    required_fields: []
    field_types: {}
  submission_trace.json:
    required_fields:
    - workflow_stages
    - execution_evidence
    - scientific_decisions
    - input_samples_used
    - mc_weighting_evidence
    - validation_checks
    - observable_constructed
    - inference_strategy
    - result_summary
    - output_files_generated
    field_types:
      workflow_stages: array_object
      execution_evidence: object
      scientific_decisions: array_object
      observable_constructed: object
      inference_strategy: object
      result_summary: object
      output_files_generated: array_string
      input_samples_used: array_object
      mc_weighting_evidence: object
      validation_checks: array_object
    nested_required_fields:
      workflow_stages:
        required_fields:
        - stage_label
        - status
      execution_evidence:
        required_fields:
        - files_processed_count
        - events_processed_total
        - selected_events_total
        - candidates_built_total
        - histogram_filled_entries
        field_types:
          files_processed_count: integer
          events_processed_total: integer
          selected_events_total: integer
          candidates_built_total: integer
          histogram_filled_entries: integer
      scientific_decisions:
        required_fields:
        - decision
        - reason
        - impact_on_analysis
      observable_constructed:
        required_fields:
        - name
      inference_strategy:
        required_fields:
        - method_family
      result_summary:
        required_fields:
        - conclusion
      input_samples_used:
        required_fields:
        - sample_name
        - sample_role
        - files_used
      mc_weighting_evidence:
        required_fields:
        - data_policy
        - mc_policy
        - luminosity_fb_inv
        - weight_formula
        - event_weight_factors_used
        - sample_normalization_fields
        - scale_factors_used
        - missing_fields
        - fallback_strategy
        - uncertainty_policy
        field_types:
          data_policy: string
          mc_policy: string
          luminosity_fb_inv: float
          weight_formula: string
          event_weight_factors_used: array_string
          sample_normalization_fields: array_string
          scale_factors_used: array_string
          missing_fields: array_string
          fallback_strategy: string
          uncertainty_policy: string
      validation_checks:
        required_fields:
        - validation_type
        - status
        - result_summary
    constraints:
      output_files_generated:
        min_length: 4
        contains_all:
        - four_lepton_mass_spectrum.json
        - four_lepton_excess_summary.json
        - interpretation.md
        - submission_trace.json
      workflow_stages:
        min_length: 1
      scientific_decisions:
        min_length: 1
      validation_checks:
        min_length: 1
