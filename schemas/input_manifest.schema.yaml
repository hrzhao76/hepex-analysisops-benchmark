schema_version: 1
kind: input_manifest
description: Runtime-readable input data manifest.
required_fields:
  - task_id
  - files
file_entry_required_fields:
  - logical_name
  - path
optional_file_entry_fields:
  - size_bytes
  - format
  - source
  - checksum
  - sample_id
  - sample_name
  - sample_group_id
  - sample_group_label
  - sample_role
  - did
  - is_data
  - is_mc
  - weight_policy
  - metadata
optional_top_level_fields:
  - samples
  - sample_groups
  - manifest_kind
